# CENTRAL WORKFLOW MENU / REQUEST
#
# This file is documentation/request metadata, not executable GitHub Actions.
#
# POLICY (HereLiesAz/workflows: docs/WORKFLOW_POLICY.md)
# - Do not add a new implementation under .github/workflows in this repository.
#   The one exception is this repository's own CI (.github/workflows/ci.yml), which runs
#   here and declares itself with the ci-report action.
# - New implementations are submitted to HereLiesAz/workflows first.
# - New implementations must be repository-agnostic.
# - Reuse an existing central credential from policy/workflow-policy.json whenever possible.
# - If a new one is unavoidable, declare its exact name and plain-language purpose.
#
# GENERAL
#   ci-validation              build/test/validation
#   codeql-scan               CodeQL security scan
#   issue-summary             issue summarization
#   jules-dispatch            Jules request dispatch
#   jules-glee                Codex PR Glee audit
#   jules-auto-assign         Jules issue assignment
#   context-backup            repository context backup
#   clear-cache               cache cleanup
#
# ANDROID
#   android-dependency-update managed Android native dependency refresh
#   android-github-release    build/sign APK and publish GitHub release
#   android-play-release      build/sign AAB and publish to Google Play
#
# RELEASES / PACKAGES
#   artifact-github-release   publish existing artifacts to GitHub Releases
#   multi-platform-app-release build/release a multi-platform application
#   desktop-package           native desktop packaging
#   maven-package-publish     Maven/GitHub Packages/JitPack-oriented publishing
#   node-package-publish      Node package publishing
#   azp-model-release         managed model asset release
#   azp-sign-release          release signing
#
# DEPLOYMENT
#   website-sftp-deploy       build/deploy website over SFTP
#   github-pages-deploy       build a static site and publish it to the repository's own GitHub Pages
#   cloudflare-worker-deploy  test and deploy a Cloudflare Worker with Wrangler
#
# In use: github-pages-deploy (the wasm PWA; bound, tracker at .github/workflows/github-pages-deploy.yml).
requested:
  - android-github-release

# What the central Android GitHub Release binding needs to know about this app (its purpose
# profile). No new workflow and no new credential: signing reuses the account's existing
# keystore, passed to Gradle as android.injected.signing.* arguments.
android-github-release:
  app_name: Camera Unroll
  package_name: com.hereliesaz.cameraunroll
  java_version: "17"
  signing: raw-jks
  inject_signing_args: true
  google_services: none
  build_command: >-
    ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace
    -PversionName="$VERSION"
  artifact_glob: composeApp/build/outputs/apk/release/*.apk
  mapping_file: composeApp/build/outputs/mapping/release/mapping.txt
  # version.properties at the repository root is the version file (versionMajor/Minor/Patch/Build,
  # plus the versionCode the release records back). The build reads -PversionCode /
  # -PversionCodeOverride and -PversionName, as the central android-version action passes them.
  version_file: version.properties
  trigger: push to main

new_workflow_request:
  name: ""
  purpose: ""
  required_inputs: []
  required_secrets: []
